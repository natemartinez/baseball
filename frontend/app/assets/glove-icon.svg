<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm golden-tan leather -->
    <linearGradient id="gloveLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A852" />
      <stop offset="55%" stop-color="#DE8328" />
      <stop offset="100%" stop-color="#AC5410" />
    </linearGradient>

    <!-- Warm palm crease contour (blends with leather instead of a dark cavity) -->
    <linearGradient id="palmShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C26A1B" />
      <stop offset="100%" stop-color="#934509" />
    </linearGradient>

    <!-- Cream rawhide lacing -->
    <linearGradient id="laceTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E3" />
      <stop offset="100%" stop-color="#E2CA9D" />
    </linearGradient>
  </defs>

  <!-- Base Mitt Body -->
  <g id="mitt-base" stroke="#231005" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- Backing & Fingers Shell -->
    <path d="M 130 420
             C 70 380 50 280 62 210
             C 72 150 120 120 162 155
             C 178 170 190 200 196 235
             C 210 160 238 90 284 90
             C 324 90 338 135 344 180
             C 362 105 408 115 422 170
             C 442 160 464 195 460 250
             C 455 330 410 410 330 435
             C 260 455 180 450 130 420 Z" fill="url(#gloveLeather)" />

    <!-- Palm Crease Shading -->
    <path d="M 175 250
             C 205 235 265 240 295 275
             C 310 295 305 335 280 355
             C 245 380 185 365 170 320
             C 162 290 165 260 175 250 Z" fill="url(#palmShade)" stroke="#823A06" stroke-width="6" />

    <!-- Thumb Wing (Folded front pad) -->
    <path d="M 72 215
             C 80 165 125 140 160 170
             C 190 195 195 250 190 310
             C 185 365 140 405 105 375
             C 75 345 66 265 72 215 Z" fill="url(#gloveLeather)" />

    <!-- Palm Heel Pad -->
    <path d="M 125 390
             C 165 375 255 375 305 350
             C 325 395 295 435 240 440
             C 180 445 135 425 125 390 Z" fill="#B86221" />

    <!-- Finger Dividers -->
    <path d="M 284 90 C 286 140 285 200 280 235" fill="none" stroke="#231005" stroke-width="12" />
    <path d="M 350 115 C 354 165 352 210 342 250" fill="none" stroke="#231005" stroke-width="12" />
    <path d="M 412 165 C 408 215 398 260 385 295" fill="none" stroke="#231005" stroke-width="12" />
  </g>

  <!-- H-Web Bridge (Transparent slots allow tile background through) -->
  <g id="h-web" stroke="#231005" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Horizontal Crossbar -->
    <path d="M 145 162 L 235 130" fill="none" stroke="url(#gloveLeather)" stroke-width="26" />
    <path d="M 145 162 L 235 130" fill="none" stroke="#231005" stroke-width="10" />

    <!-- Center Vertical Bridge -->
    <path d="M 188 145 L 202 232" fill="none" stroke="url(#gloveLeather)" stroke-width="22" />
    <path d="M 188 145 L 202 232" fill="none" stroke="#231005" stroke-width="10" />

    <!-- Lower Horizontal Crossbar -->
    <path d="M 168 202 L 226 186" fill="none" stroke="url(#gloveLeather)" stroke-width="20" />
    <path d="M 168 202 L 226 186" fill="none" stroke="#231005" stroke-width="8" />
  </g>

  <!-- High-Contrast Rawhide Lacing -->
  <g id="laces" stroke="url(#laceTone)" stroke-width="9" stroke-linecap="round">
    <!-- Finger Ridge Spiral Ties -->
    <line x1="262" y1="92" x2="278" y2="108" />
    <line x1="298" y1="96" x2="314" y2="114" />
    <line x1="334" y1="108" x2="350" y2="128" />
    <line x1="388" y1="126" x2="400" y2="148" />

    <!-- Web Cross-Lacing -->
    <line x1="160" y1="138" x2="182" y2="152" />
    <line x1="202" y1="124" x2="222" y2="138" />

    <!-- Pocket Spiral Base -->
    <line x1="172" y1="362" x2="194" y2="380" />
    <line x1="202" y1="372" x2="226" y2="388" />
    <line x1="236" y1="376" x2="260" y2="390" />

    <!-- Wrist Strap Anchor Laces -->
    <line x1="150" y1="428" x2="210" y2="444" />
    <line x1="230" y1="446" x2="290" y2="440" />
  </g>

  <!-- Bright Edge Rims -->
  <g id="rim-accents" stroke="#FFD28D" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M 80 205 C 88 165 125 145 152 165" />
    <path d="M 248 108 C 270 94 300 94 316 112" />
    <path d="M 368 116 C 392 118 412 135 422 162" />
    <path d="M 445 200 C 454 235 448 300 405 370" />
  </g>
</svg>
